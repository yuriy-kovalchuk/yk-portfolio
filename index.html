<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YK</title>
    
    <!-- Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://img.shields.io; connect-src 'self' https://cdn.jsdelivr.net;">

    <!-- SEO & Social Media Meta Tags -->
    <meta name="description" content="Yuriy Kovalchuk - DevOps & Platform Engineer specializing in Kubernetes, GitOps, and Cloud Infrastructure.">
    <meta property="og:title" content="Yuriy Kovalchuk | DevOps & Platform Engineer">
    <meta property="og:description" content="Infrastructure as Code, Kubernetes Orchestration, and Automated CI/CD Pipelines.">
    <meta property="og:type" content="website">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Nerd:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
    
    <!-- External Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.3/dist/purify.min.js"></script>
    <script src="content.js"></script>
</head>
<body>
    <div class="container">
        <header class="header-card">
            <div class="header-content">
                <div id="profile-pic-container">
                    <!-- Profile Pic loaded here -->
                </div>
                <div class="profile-info">
                    <h1 id="name">[ LOADING_USER ]</h1>
                    <p id="title"></p>
                    <div class="theme-selector">
                        <select id="theme-select" class="theme-dropdown">
                            <option value="dracula" selected>DRACULA</option>
                            <option value="nord">NORD</option>
                            <option value="gruvbox">GRUVBOX</option>
                            <option value="tokyo-night">TOKYO_NIGHT</option>
                            <option value="rose-pine">ROSE_PINE</option>
                        </select>
                    </div>
                    <div class="links">
                        <a href="#" id="github-link" class="btn" target="_blank" rel="noopener noreferrer">GITHUB</a>
                        <a href="#" id="linkedin-link" class="btn" target="_blank" rel="noopener noreferrer">LINKEDIN</a>
                    </div>
                </div>
            </div>
        </header>

        <div id="content-area">
            <!-- Dashboard View -->
            <div id="dashboard-view">
                <div class="main-col">
                    <div class="card">
                        <h2>IDENTITY</h2>
                        <div id="bio-content">Loading...</div>
                    </div>

                    <div class="card">
                        <h2>THE_JOURNEY</h2>
                        <div id="experiences-content">Loading...</div>
                    </div>
                    
                    <div class="card">
                        <h2>RESEARCH_PHASE</h2>
                        <div id="research-content">Loading...</div>
                    </div>
                </div>
                <div class="side-col">
                    <div class="card">
                        <h2>MY_PLAYGROUND</h2>
                        <div id="skills-content">Loading...</div>
                    </div>

                    <div class="card">
                        <h2>SIDE_QUESTS</h2>
                        <ul id="projects-list">
                            <!-- Project links will be injected here -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Project Details View (Hidden by default) -->
            <div id="details-view" style="display: none;">
                <button id="back-to-dashboard" class="btn">← BACK</button>
                <div class="card">
                    <h2 id="detail-title">PROJECT_TITLE</h2>
                    <div id="detail-content">Project description...</div>
                    <div class="card-actions">
                        <a href="#" id="detail-repo-link" class="btn" target="_blank" rel="noopener noreferrer">VIEW ON GITHUB</a>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>yk-portfolio v1.0.0</p>
            <span class="hint">[ HINT: Use HJKL to navigate, ENTER to select, H to go back ]</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
