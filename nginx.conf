# Hugo fingerprints CSS and JS filenames, so those are cached forever. Everything
# else is served from paths that do not change between releases, so it gets a
# bounded lifetime. Keyed on the response type so a single set of response
# headers can be declared once: nginx drops inherited add_header directives as
# soon as a location declares its own.
map $sent_http_content_type $yk_cache_control {
    default                "no-cache";
    text/css               "public, max-age=31536000, immutable";
    application/javascript "public, max-age=31536000, immutable";
    text/javascript        "public, max-age=31536000, immutable";
    font/woff2             "public, max-age=2592000";
    image/svg+xml          "public, max-age=604800";
    image/jpeg             "public, max-age=604800";
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Directory redirects stay relative so they never leak the container port.
    absolute_redirect off;

    # Everything the page loads comes from this origin, which lets the policy
    # stay closed: no inline scripts, no CDN, no third-party fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $yk_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Every error gets a page of ours: the built-in ones print the server's name.
    error_page 404 /404.html;
    error_page 400 401 403 405 408 413 414 500 502 503 504 /error.html;
    location = /404.html { internal; }
    location = /error.html { internal; }
}
