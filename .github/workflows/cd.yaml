name: CD

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build-image:
    name: Scan, then build & push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Scanned before anything is pushed: a failing scan leaves :latest on the last good image.
      - name: Build the image to scan
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: yk-portfolio:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yk-portfolio:scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Trivy image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true # the report step above already fetched today's database
        with:
          image-ref: yk-portfolio:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      # Same Dockerfile and build cache as the scanned image, so the amd64 layers are the ones scanned.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/yuriy-kovalchuk/yk-portfolio:${{ steps.date.outputs.tag }}
            ghcr.io/yuriy-kovalchuk/yk-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
